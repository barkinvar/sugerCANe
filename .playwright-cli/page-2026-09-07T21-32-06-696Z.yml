        - paragraph [ref=e105]: Install one shunt at most on each power or bias selector. Disconnect board power before changing jumpers. JP1 is momentary reset; leave it open. JP2 is CAN termination; fit it only at a physical end of the trunk.
      - generic [ref=e106]:
        - heading "Connection limits" [level=2] [ref=e107]
        - list [ref=e108]:
          - listitem [ref=e109]: Each sensor connector is pin 1 POWER, pin 2 GND, pin 3 SIGNAL. The board targets 0–30 V positive signals and a 6–18 V protected board supply.
          - listitem [ref=e110]: Battery power follows the robot battery. A sensor requiring 10 V can fail during a battery sag while this interface continues running.
          - listitem [ref=e111]: Logic mode targets LOW ≤0.8 V and HIGH ≥2.4 V. Industrial mode targets LOW ≤4 V and HIGH ≥7 V.
          - listitem [ref=e112]: Industrial NPN/PNP examples assume ≤0.5 mA off leakage. The 3.3 V open-drain pull-up example assumes ≤50 µA. Check the actual sensor datasheet.
          - listitem [ref=e113]: External supply voltage must never enter a POWER pin. Externally powered 24 V sensors need the wiring arrangements in the full guide.
        - paragraph [ref=e114]: This worksheet performs arithmetic and selects documented modes. It does not establish sensor compatibility, measured electrical ratings, or robot inspection approval.
        - paragraph [ref=e115]:
